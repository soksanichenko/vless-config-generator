---
# Superseded by per-request resolution in location.conf.j2; remove the
# static upstream file left by older deploys.
- name: Remove the old vless-config-generator-api nginx upstream config
  ansible.builtin.file:
    path: "{{ nginx_custom_upstream_path }}/vless-config-generator-api.conf"
    state: absent
  become: yes
  notify: Reload nginx
  tags:
    - vless-config-generator
    - vless-config-generator-nginx

- name: Deploy vless-config-generator nginx location config
  ansible.builtin.template:
    src: location.conf.j2
    dest: "{{ nginx_domain_custom_locations_path }}/vless-config-generator.conf"
    mode: '0644'
  become: yes
  notify: Reload nginx
  tags:
    - vless-config-generator
    - vless-config-generator-nginx

- name: Register vless-config-generator with the Discord SSO portal
  ansible.builtin.uri:
    url: https://meow-elite.club/api/services/register
    method: POST
    headers:
      Authorization: "Bearer {{ meow_elite_club_portal_service_registration_token }}"
    body_format: json
    body:
      slug: "{{ vless_config_generator_service_slug }}"
      name: "VLESS config generator"
      url: "https://{{ vless_config_generator_domain }}/"
    status_code: [200]
  no_log: true
  tags:
    - vless-config-generator
    - vless-config-generator-nginx
...
