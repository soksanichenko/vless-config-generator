---
- name: Build vless-config-generator frontend locally
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ vless_config_generator_local_source_dir }}/frontend"
  delegate_to: localhost
  become: no
  changed_when: true
  tags:
    - vless-config-generator

- name: Create vless-config-generator static directory (nginx-accessible)
  ansible.builtin.file:
    path: "{{ nginx_html_path }}/static/vless-config-generator"
    state: directory
    mode: '0755'
  become: yes
  tags:
    - vless-config-generator

- name: Sync vless-config-generator frontend build to nginx html directory
  ansible.posix.synchronize:
    src: "{{ vless_config_generator_local_source_dir }}/frontend/dist/"
    dest: "{{ nginx_html_path }}/static/vless-config-generator/"
    delete: yes
    owner: no
    group: no
  become: yes
  tags:
    - vless-config-generator

- name: Create vless-config-generator-api data directory
  ansible.builtin.file:
    path: "{{ vless_config_generator_api_data_dir }}"
    state: directory
    mode: '0755'
  become: yes
  tags:
    - vless-config-generator
    - vless-config-generator-api

- name: Sync vless-config-generator-api source to build directory
  ansible.posix.synchronize:
    src: "{{ vless_config_generator_local_source_dir }}/sources/"
    dest: "{{ vless_config_generator_api_data_dir }}/"
    delete: yes
    owner: no
    group: no
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.venv"
      - "--exclude=config.yaml"
  become: yes
  register: _vless_config_generator_api_source
  tags:
    - vless-config-generator
    - vless-config-generator-api

- name: Build vless-config-generator-api Docker image
  community.docker.docker_image:
    name: vless-config-generator-api
    tag: local
    source: build
    build:
      path: "{{ vless_config_generator_api_data_dir }}"
      pull: yes
    force_source: "{{ _vless_config_generator_api_source.changed }}"
  become: yes
  tags:
    - vless-config-generator
    - vless-config-generator-api

- name: Deploy vless-config-generator-api config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ vless_config_generator_api_data_dir }}/config.yaml"
    mode: '0600'
  become: yes
  no_log: true
  tags:
    - vless-config-generator
    - vless-config-generator-api

- name: Deploy vless-config-generator-api container
  community.docker.docker_container:
    name: "{{ vless_config_generator_api_container_name }}"
    image: "{{ vless_config_generator_api_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: "{{ docker_force_recreate | default(false) }}"
    pull: false
    networks:
      - name: "{{ docker_network }}"
    log_driver: journald
    volumes:
      - "{{ vless_config_generator_api_data_dir }}/config.yaml:/app/config.yaml:ro"
  become: yes
  tags:
    - vless-config-generator
    - vless-config-generator-api

- name: Configure vless-config-generator nginx
  import_tasks: nginx.yml
  tags:
    - vless-config-generator
    - vless-config-generator-nginx

- name: Purge Cloudflare cache
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_id }}/purge_cache"
    method: POST
    headers:
      Authorization: "Bearer {{ cf_api_token_clear_cache }}"
      Content-Type: "application/json"
    body_format: json
    body:
      purge_everything: true
    status_code: 200
  when: cf_purge_cache | default(false) | bool
  delegate_to: localhost
  no_log: true
  tags:
    - vless-config-generator
    - cf-purge
...
