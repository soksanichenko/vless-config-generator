[project]
name = "vless-config-generator"
version = "0.1.0"
description = "Browser-based sing-box routing-rule editor for VLESS clients on zelgray.work"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "httpx==0.28.1",
    "redis==5.2.1",
    "pyyaml==6.0.3",
    "pydantic==2.11.5",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.41",
    "sqlalchemy-utils==0.41.2",
    "alembic==1.16.2",
    "psycopg[binary]==3.3.4",
    "itsdangerous==2.2.0",
]

[tool.setuptools.packages.find]
where = ["sources/src"]
