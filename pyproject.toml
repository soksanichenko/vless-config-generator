[project]
name = "vless-config-generator"
version = "0.1.0"
description = "Browser-based sing-box routing-rule editor for VLESS clients on zelgray.work"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "httpx==0.28.1",
    "redis==8.0.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.51",
    "sqlalchemy-utils==0.42.1",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "itsdangerous==2.2.0",
]

[tool.setuptools.packages.find]
where = ["sources/src"]
