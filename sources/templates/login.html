<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vless-config-generator — Login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; color: #1b1e24; }
    h1 { font-size: 1.3rem; }
    .field { margin-top: 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; padding: 0.5rem 1rem; cursor: pointer; width: 100%; }
    .error { color: #b3261e; font-size: 0.9rem; margin-top: 1rem; }
    .help-text { color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>

<h1>VLESS Config Generator</h1>
<p class="help-text">Log in with your VLESS client's email and UUID.</p>

<form method="post" action="/login">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <div class="field">
    <label for="uuid">UUID</label>
    <input type="text" id="uuid" name="uuid" required>
  </div>
  <button type="submit">Log in</button>
</form>

{% if error %}
<p class="error">Invalid email or UUID.</p>
{% endif %}

</body>
</html>
