<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vless-config-generator — Admin login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; color: #1b1e24; }
    h1 { font-size: 1.3rem; }
    .field { margin-top: 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; padding: 0.5rem 1rem; cursor: pointer; width: 100%; }
    .error { color: #b3261e; font-size: 0.9rem; margin-top: 1rem; }
  </style>
</head>
<body>

<h1>Admin login</h1>

<form method="post" action="/admin/login">
  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button type="submit">Log in</button>
</form>

{% if error %}
<p class="error">Invalid username or password.</p>
{% endif %}

</body>
</html>
