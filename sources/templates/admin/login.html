<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vless-config-generator — Admin login</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --text-dim: #9aa1ad;
      --accent: #4f8cff;
      --danger: #ff6b6b;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin: 1rem;
    }
    h1 { font-size: 1.2rem; margin: 0 0 16px; }
    .field { margin-top: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 0.3rem; }
    input {
      width: 100%;
      background: #0d0f13;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #06121f;
      font-weight: 600;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>Admin login</h1>

  <form method="post" action="/admin/login">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Log in</button>
  </form>

  {% if error %}
  <p class="error">Invalid username or password.</p>
  {% endif %}
</div>

</body>
</html>
